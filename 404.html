<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Page Not Found | Charan Sai</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  // Handle clean URLs on GitHub Pages (e.g. /about -> /about.html)
  (function() {
    var path = window.location.pathname;
    var clean = path.replace(/\/$/, "");
    var lastSegment = clean.split('/').pop();
    var validPages = ['about', 'projects', 'experience', 'contact', 'case-study', 'disease-ai', 'patientflow', 'cta'];
    if (validPages.includes(lastSegment.toLowerCase())) {
      window.location.replace(clean + ".html" + window.location.search + window.location.hash);
    }
  })();
</script>
<style>
:root {
  --bg: #050505;
  --accent: #818cf8;
  --text-main: #ffffff;
  --text-dim: #9ca3af;
  --surface: #111113;
  --border: rgba(255,255,255,0.06);
}
* { margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans',sans-serif; }
body {
  background: var(--bg);
  color: var(--text-main);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 20px;
}
h1 { font-size: 5rem; font-weight: 800; color: var(--accent); margin-bottom: 10px; }
h2 { font-size: 1.8rem; margin-bottom: 15px; }
p { color: var(--text-dim); max-width: 480px; margin-bottom: 30px; font-size: 1.1rem; }
a.btn {
  display: inline-block;
  padding: 14px 32px;
  background: #ffffff;
  color: #000000;
  text-decoration: none;
  font-weight: 700;
  border-radius: 12px;
  transition: 0.3s;
}
a.btn:hover { background: var(--accent); color: #ffffff; }
</style>
</head>
<body>
  <h1>404</h1>
  <h2>Page Not Found</h2>
  <p>The page you are looking for doesn't exist or has moved.</p>
  <a href="index.html" class="btn">Return to Homepage</a>
</body>
</html>
